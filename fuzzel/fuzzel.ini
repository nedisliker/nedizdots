[main]
font=JetBrainsMono Nerd Font:size=11
use-bold=yes

width=45
lines=8
horizontal-pad=16
vertical-pad=12
inner-pad=8

anchor=center
layer=overlay

prompt="❯  "
placeholder="Search"
icon-theme=Papirus-Dark
icons-enabled=yes

image-size-ratio=0.7

exit-on-keyboard-focus-loss=yes

[colors]
background=0c120ff2
text=dfe3dcff
prompt=9eae91ff
placeholder=626b62ff
input=dfe3dcff
match=b0c5a0ff
selection=222b24ff
selection-text=ffffffff
selection-match=b0c5a0ff
border=354039ff

[border]
width=1
radius=2

[dmenu]
mode=text
exit-immediately-if-empty=no
