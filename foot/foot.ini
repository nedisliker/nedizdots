[main]
font=JetBrainsMono Nerd Font:size=11
font-bold=JetBrainsMono Nerd Font:style=Bold:size=11
font-italic=JetBrainsMono Nerd Font:style=Italic:size=11
font-bold-italic=JetBrainsMono Nerd Font:style=Bold Italic:size=11

dpi-aware=yes
pad=14x12
title=foot
locked-title=no

[scrollback]
lines=10000
multiplier=3.0

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=0.95
foreground=dfe3dc
background=0c120f

selection-foreground=0c120f
selection-background=c7d0c2

cursor=0c120f dfe3dc

regular0=151b17
regular1=d66f6f
regular2=9eae91
regular3=d5b86a
regular4=91a9c4
regular5=b6a0c9
regular6=8eb8b0
regular7=d7d9d4

bright0=626b62
bright1=e78383
bright2=b0c5a0
bright3=e6cb7c
bright4=a7c0df
bright5=cbb3df
bright6=a1d0c5
bright7=ffffff

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0

[url]
launch=xdg-open ${url}
label-letters=arstneio
